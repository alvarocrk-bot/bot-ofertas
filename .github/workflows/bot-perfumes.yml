name: Bot ofertas perfumes

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-perfumes
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar bot
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO || secrets.SMTP_USER }}
        run: python bot_perfumes.py
      - name: Guardar historial
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add historial_perfumes.json avisados_perfumes.json plataformas_perfumes.json
          git diff --staged --quiet || git commit -m "actualiza historial perfumes"
          git pull --rebase -X theirs
          git push
